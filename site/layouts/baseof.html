<!doctype html>
<html lang="en">
<head>
{{ partial "head.html" . }}
</head>
<body{{ if eq .Section "docs" }} class="is-docs"{{ end }}>
{{ partial "sprite.html" . }}
<a class="skip" href="{{ block "skip" . }}#main{{ end }}">Skip to content</a>
{{ partial "header.html" . }}
<main id="main" tabindex="-1" class="site-main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ block "scripts" . }}{{ end }}
</body>
</html>
