{{- /* A Markdown table in a wrapper that scrolls sideways on narrow
       screens. Alignment is a class, not a style attribute, for the CSP. */ -}}
<div class="table-wrap">
<table>
	<thead>
		{{- range .THead }}
		<tr>{{ range . }}<th{{ with .Alignment }} class="align-{{ . }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>
		{{- end }}
	</thead>
	<tbody>
		{{- range .TBody }}
		<tr>{{ range . }}<td{{ with .Alignment }} class="align-{{ . }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>
		{{- end }}
	</tbody>
</table>
</div>
{{- /* */ -}}
