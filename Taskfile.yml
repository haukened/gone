# https://taskfile.dev

version: '3'

# Build minified assets into web/dist and compile with -tags=prod

vars:
  MINIFY_BIN: "minify"

tasks:
  # Default: show usage
  default:
    cmds:
      - task -l
    silent: true

  # deprecated in favor of using the flake provided by nixpkgs
  #install-minify:
  #  desc: Install tdewolff/minify CLI
  #  cmds:
  #    - go install github.com/tdewolff/minify/v2/cmd/minify@latest

  clean:
    desc: Cleans all build artifacts (bin/ and web/dist/)
    cmds:
      - rm -rf bin
      - rm -rf web/dist

  minify:
    desc: Minify assets into web/dist
    cmds:
      - mkdir -p web/dist/{css,js,fonts,img,messages}
      - cp web/*.html web/dist/
      - cp web/messages/*.json web/dist/messages/
      - cp web/fonts/* web/dist/fonts/
      - cp web/img/* web/dist/img/
      - '{{.MINIFY_BIN}} -r -o web/dist/css/ web/css/'
      - '{{.MINIFY_BIN}} -r -o web/dist/js/ web/js/'
  
  build-dev:
    desc: Build development server (goned) without -tags=prod, and the gone CLI
    cmds:
      - mkdir -p bin
      - go build -o bin/goned ./cmd/goned
      - go build -o bin/gone ./cmd/gone

  build-prod:
    desc: Build static production server (goned, -tags=prod) and gone CLI (CGO disabled)
    deps: [minify]
    env:
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p bin
      - go build -trimpath -tags=prod -ldflags='-s -w -buildid=' -o bin/goned ./cmd/goned
      - go build -trimpath -ldflags='-s -w -buildid=' -o bin/gone ./cmd/gone

  release:
    desc: Cross-build release archives and SHA256SUMS into dist/ (usage - task release -- vX.Y.Z)
    deps: [minify]
    cmds:
      - scripts/release.sh {{.CLI_ARGS}}

  prod:
    desc: Orchestrate full production build (clean → minify → copy templates → go build -tags=prod)
    cmds:
      - task: clean
      - task: minify
      - task: build-prod

  dev:
    desc: Orchestrate development build (no embed/minify)
    cmds:
      - task: clean
      - task: build-dev

  run:
    desc: Run development locally
    env:
      GONE_DATA_DIR: ".tmp"
      GONE_METRICS_ADDR: ":9090"
    cmds:
      - task: clean
      - task: dev
      - cmd: mkdir -p .tmp
      - cmd: bin/goned
        interactive: true
        ignore_error: true
  
  perf:
    desc: Check the latency target (p95 under 50ms at 100 req/s); set TMPDIR to test a specific disk
    env:
      GONE_PERF: '1'
    cmds:
      - go test ./test -run TestPerfLatencyTarget -count=1 -v

  cover:
    desc: Run tests with coverage output
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  test:
    desc: Run Go and JavaScript unit tests
    cmds:
      - go test ./...
      - task: test-js

  test-js:
    desc: Run JavaScript unit tests (requires Node 20+, no npm install)
    cmds:
      - node --test 'test/js/*.test.js'

  cover-js:
    desc: Run JavaScript unit tests with coverage output
    cmds:
      - node --test --experimental-test-coverage --test-coverage-include='web/js/**' --test-coverage-include='web/dev/**' 'test/js/*.test.js'

  e2e:
    desc: Run the browser end-to-end tests (Playwright; first run task e2e-install)
    deps: [prod]
    dir: test/e2e
    cmds:
      - npm ci --no-audit --no-fund
      - npx playwright test {{.CLI_ARGS}}

  interop-signin:
    desc: Check sign-in against real proxies in Docker (Dex + oauth2-proxy, Authelia + Caddy); not run in CI
    deps: [build-prod]
    cmds:
      - test/interop/signin/run.sh

  site:
    desc: Build the website into site/public with the pinned Hugo (tools/hugo); fails on a broken link or heading anchor
    env:
      CGO_ENABLED: '0'
    cmds:
      - go tool -modfile=tools/hugo/go.mod hugo --source site --minify --cleanDestinationDir

  site-serve:
    desc: Preview the website at http://127.0.0.1:8088, rebuilding on save (over SSH - ssh -L 8088:localhost:8088 <host>)
    env:
      CGO_ENABLED: '0'
    cmds:
      - go tool -modfile=tools/hugo/go.mod hugo server --source site --bind 127.0.0.1 --port 8088 --baseURL http://localhost:8088/ --disableFastRender

  shellcheck:
    desc: Check every shell script with shellcheck (pinned, in Docker, as CI does)
    cmds:
      - scripts/shellcheck.sh

  packages:
    desc: Build a test release (v0.0.0-dev) with its .deb and .rpm packages, then lint and install them in Debian, Ubuntu and Fedora containers
    deps: [minify]
    cmds:
      - scripts/release.sh v0.0.0-dev
      - test/packages/run.sh

  install-test:
    desc: Check install.sh against the release in dist/ (run task packages first)
    cmds:
      - test/install/run.sh

  helm-lint:
    desc: Check the Helm chart without a cluster (helm lint, kubeconform, refused settings); needs helm and kubeconform
    cmds:
      - test/helm/lint.sh

  helm-test:
    desc: Install the Helm chart on a kind cluster and test it (ENVOY=0 skips Envoy Gateway, KEEP=1 keeps the cluster)
    deps: [build-prod]
    cmds:
      - test/helm/run.sh

  e2e-install:
    desc: Install the browsers the end-to-end tests use (Chromium, Firefox, WebKit)
    dir: test/e2e
    cmds:
      - npm ci --no-audit --no-fund
      - npx playwright install --with-deps chromium firefox webkit

  lint:
    desc: Run Go linters via golangci-lint, matching CI
    cmds:
      - golangci-lint run ./...
      - golangci-lint run --build-tags dev ./...

  lint-web:
    desc: Lint JavaScript (ESLint) and CSS (stylelint) with the versions locked in tools/lint, matching CI
    cmds:
      - npm ci --prefix tools/lint --no-audit --no-fund --ignore-scripts
      - tools/lint/node_modules/.bin/eslint --max-warnings 0 web/js web/dev test/js test/interop test/e2e
      - tools/lint/node_modules/.bin/stylelint 'web/css/*.css'
