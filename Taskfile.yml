# https://taskfile.dev

version: '3'

# Build minified assets into web/dist and compile with -tags=prod

vars:
  MINIFY_BIN: "minify"

tasks:
  # Default: show usage
  default:
    cmds:
      - task -l
    silent: true

  # deprecated in favor of using the flake provided by nixpkgs
  #install-minify:
  #  desc: Install tdewolff/minify CLI
  #  cmds:
  #    - go install github.com/tdewolff/minify/v2/cmd/minify@latest

  clean:
    desc: Cleans all build artifacts (bin/ and web/dist/)
    cmds:
      - rm -rf bin
      - rm -rf web/dist

  minify:
    desc: Minify assets into web/dist
    cmds:
      - mkdir -p web/dist/{css,js,fonts,img}
      - cp web/*.html web/dist/
      - cp web/fonts/* web/dist/fonts/
      - cp web/img/* web/dist/img/
      - '{{.MINIFY_BIN}} -r -o web/dist/css/ web/css/'
      - '{{.MINIFY_BIN}} -r -o web/dist/js/ web/js/'
  
  build-dev:
    desc: Build development server (goned) without -tags=prod, and the gone CLI
    cmds:
      - mkdir -p bin
      - go build -o bin/goned ./cmd/goned
      - go build -o bin/gone ./cmd/gone

  build-prod:
    desc: Build static production server (goned, -tags=prod) and gone CLI (CGO disabled)
    deps: [minify]
    env:
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p bin
      - go build -trimpath -tags=prod -ldflags='-s -w -buildid=' -o bin/goned ./cmd/goned
      - go build -trimpath -ldflags='-s -w -buildid=' -o bin/gone ./cmd/gone

  release:
    desc: Cross-build release archives and SHA256SUMS into dist/ (usage - task release -- vX.Y.Z)
    deps: [minify]
    cmds:
      - scripts/release.sh {{.CLI_ARGS}}

  prod:
    desc: Orchestrate full production build (clean → minify → copy templates → go build -tags=prod)
    cmds:
      - task: clean
      - task: minify
      - task: build-prod

  dev:
    desc: Orchestrate development build (no embed/minify)
    cmds:
      - task: clean
      - task: build-dev

  run:
    desc: Run development locally
    env:
      GONE_DATA_DIR: ".tmp"
      GONE_METRICS_ADDR: ":9090"
    cmds:
      - task: clean
      - task: dev
      - cmd: mkdir -p .tmp
      - cmd: bin/goned
        interactive: true
        ignore_error: true
  
  perf:
    desc: Check the latency target (p95 under 50ms at 100 req/s); set TMPDIR to test a specific disk
    env:
      GONE_PERF: '1'
    cmds:
      - go test ./test -run TestPerfLatencyTarget -count=1 -v

  screenshots:
    desc: Regenerate the README screenshots in docs/img (needs Node; installs Playwright into .tmp)
    vars:
      PLAYWRIGHT_VERSION: '1.62.1'
    cmds:
      - task: build-dev
      - npm install --silent --no-save --no-package-lock --prefix .tmp/screenshots playwright@{{.PLAYWRIGHT_VERSION}}
      - npm exec --prefix .tmp/screenshots -- playwright install chromium
      - NODE_PATH=.tmp/screenshots/node_modules node scripts/screenshots.cjs

  cover:
    desc: Run tests with coverage output
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  test:
    desc: Run Go and JavaScript unit tests
    cmds:
      - go test ./...
      - task: test-js

  test-js:
    desc: Run JavaScript unit tests (requires Node 20+, no npm install)
    cmds:
      - node --test 'test/js/*.test.js'

  cover-js:
    desc: Run JavaScript unit tests with coverage output
    cmds:
      - node --test --experimental-test-coverage --test-coverage-include='web/js/**' 'test/js/*.test.js'

  lint:
    desc: Run Go linters via golangci-lint, matching CI
    cmds:
      - golangci-lint run ./...
      - golangci-lint run --build-tags dev ./...

  lint-web:
    desc: Lint JavaScript (ESLint) and CSS (stylelint) via npx, matching CI
    env:
      ESLINT_USE_FLAT_CONFIG: 'false'
    cmds:
      - npx --yes eslint@9.39.5 --max-warnings 0 web/js test/js test/interop
      - npx --yes stylelint@17.15.0 'web/css/*.css'
