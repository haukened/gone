# Gone behind Caddy, which gets and renews a TLS certificate automatically.
# Browsers only encrypt on HTTPS pages, so Gone does not work over plain HTTP
# (except at http://localhost on the same machine).
#
#   1. Point a DNS name (A/AAAA record) at this host.
#   2. Open ports 80 and 443 to the internet; Caddy needs both to get a
#      certificate from Let's Encrypt.
#   3. GONE_DOMAIN=gone.example.com docker compose up -d
#
# Only Caddy is published. Gone listens on the private network below.
name: gone

services:
  gone:
    image: ghcr.io/haukened/gone:latest
    restart: unless-stopped
    environment:
      # Trust only Caddy, at its fixed address below, so Gone rate-limits each
      # visitor instead of treating everyone as Caddy.
      GONE_TRUSTED_PROXIES: 172.31.255.2/32
    volumes:
      - gone-data:/data
    networks:
      - gone
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  caddy:
    # Pinned by tag and digest; Dependabot bumps both together.
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    depends_on:
      gone:
        condition: service_healthy
    environment:
      GONE_DOMAIN: ${GONE_DOMAIN:?set GONE_DOMAIN to the DNS name of this server}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      gone:
        # Fixed so GONE_TRUSTED_PROXIES can name exactly this container.
        ipv4_address: 172.31.255.2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

networks:
  gone:
    ipam:
      config:
        # Change this if it collides with an existing network; keep
        # GONE_TRUSTED_PROXIES and Caddy's ipv4_address in step.
        - subnet: 172.31.255.0/28

volumes:
  gone-data:
  caddy-data:
  caddy-config:
