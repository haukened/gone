# nfpm config for the gone CLI package (.deb and .rpm). scripts/release.sh
# sets PKG_VERSION and PKG_ARCH and fills in ${BIN}
# (the built binary), ${CHANGELOG} and ${DEB_CHANGELOG}.
name: gone
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: semver
section: utils
priority: optional
maintainer: David Haukeness <david@hauken.us>
vendor: haukened
homepage: https://github.com/haukened/gone
license: AGPL-3.0-only
# RPM's changelog, written by release.sh: one entry pointing at the GitHub
# release. (nfpm's Debian changelog doesn't pass lintian, so release.sh
# drops this line for the .deb, which gets ${DEB_CHANGELOG} instead.)
changelog: ${CHANGELOG}
description: |-
  Send and receive one-time secrets from the command line
  gone encrypts a secret on your machine, sends only the encrypted data to
  a Gone server, and gives you a link that opens once. It also asks other people
  for secrets and opens links sent to you.
contents:
  - src: ${BIN}
    dst: /usr/bin/gone
    file_info:
      mode: 0755
  # The licence: Debian's copyright file, and RPM's %license.
  - src: LICENSE
    dst: /usr/share/doc/gone/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/gone/LICENSE
    type: license
    packager: rpm
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/gone/README.md
    type: doc
    file_info:
      mode: 0644
  # Debian only: the changelog and lintian overrides.
  - src: ${DEB_CHANGELOG}
    dst: /usr/share/doc/gone/changelog.gz
    packager: deb
    file_info:
      mode: 0644
  - src: packaging/lintian/gone
    dst: /usr/share/lintian/overrides/gone
    packager: deb
    file_info:
      mode: 0644
