openapi: 3.0.3
info:
  title: Gone Secret Sharing API
  version: 3.10.3
  description: |
    Minimal API for one-time secret creation and consumption.
    Secrets are created with a TTL and may be stored inline or in external blob storage.
    Retrieval is two-phase: GET claims the secret and returns the ciphertext with a claim
    token; DELETE with that token acknowledges receipt and deletes it. A claimed secret is
    only re-served to the token holder and is deleted by the janitor if not acknowledged
    within the configured claim lease (GONE_CLAIM_LEASE).
    Create also returns a manage token. Sending it in the X-Gone-Manage header lets the
    sender check whether the secret is still pending, or revoke it before it is opened.
    There are no tombstones: opened, revoked, expired, unknown, and wrong-token secrets
    all return the same 404.
    Secret requests run the other way (protocol v3, docs/protocol.md 4.3 and 8.6): a
    requester opens a request and gets a manage token and a fill token; whoever holds the
    reply link sends one reply encrypted to the requester's public key, which only the
    requester can claim with the manage token. The server never sees either key.
    This spec enumerates all HTTP statuses the current implementation may emit.
    A trailing slash is not part of a route: `/api/secret/{id}/` and
    `/api/request/{id}/reply/` are 404, never an alias of the route without it.
    X-Gone-Manage, X-Gone-Fill and X-Gone-Claim must each appear at most once; a
    repeated header is a 400 for that token. If the client disconnects mid-request the
    server records 499 and logs nothing at error level; no client ever sees it.
    Every route also returns 400 `invalid correlation id` when an X-Correlation-ID request
    header is present but is not a UUID.
    Metrics are not part of this API: they are served on a separate, token-protected
    listener (GONE_METRICS_ADDR) and documented in docs/metrics.md.
servers:
  - url: /
    description: >-
      The Gone instance serving this spec. Production deployments must use
      HTTPS; the manage token is a bearer credential.
tags:
  - name: secrets
    description: Create, claim, and acknowledge one-time secrets. Anonymous.
  - name: manage
    description: Sender-only status and revoke, authorized by the manage token.
  - name: requests
    description: >-
      Secret requests. Creating one is anonymous; the reply page uses the fill
      token and the requester uses the manage token.
  - name: health
    description: Liveness and readiness probes.
  - name: i18n
    description: Message catalogs the web pages use to switch language in place.
paths:
  /api/secret:
    post:
      summary: Create a new secret
      operationId: createSecret
      description: |
        Stores client-side encrypted ciphertext with a TTL. The server never sees
        the key. Returns the secret ID, its expiry, and a one-time manage token.
      tags: [secrets]
      parameters:
        - in: header
          name: X-Gone-Version
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]{0,2}$'
            example: '1'
          description: >-
            Protocol version in canonical decimal (no sign, no leading zeros).
            Must be a supported version: 1, or 2 for a passphrase-protected
            secret. Must appear exactly once. See docs/protocol.md §3 and §8.
        - in: header
          name: X-Gone-Nonce
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{16}$'
          description: >-
            Strict, canonical, unpadded base64url of the 12-byte AES-GCM nonce
            (protocols v1 and v2). Must appear exactly once. See
            docs/protocol.md §2.1 and §4.
        - in: header
          name: X-Gone-TTL
          required: true
          schema:
            type: string
            pattern: '^[0-9]+(h|m|s)([0-9]+(h|m|s))*$'
          description: |
            Go duration string composed of hours, minutes, and seconds segments only (no days/weeks/months).
            Examples: 30s, 5m, 1h30m, 1h5m30s. Must fall within the configured inclusive min/max TTL bounds.
            The service also accepts any duration between the smallest and largest configured TTL options even if not explicitly listed.
        - in: header
          name: Content-Length
          required: true
          schema:
            type: integer
            minimum: 1
          description: Exact ciphertext byte length; enforced against service MaxBytes.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                type: object
                required: [id, expires_at, manage_token]
                properties:
                  id:
                    type: string
                    description: 32-char lowercase hex secret ID
                    pattern: '^[0-9a-f]{32}$'
                  expires_at:
                    type: string
                    format: date-time
                  manage_token:
                    type: string
                    pattern: '^[A-Za-z0-9_-]{43}$'
                    description: >-
                      Sender's manage token: 32 random bytes as unpadded
                      base64url. Only its SHA-256 is stored, so it cannot be
                      recovered later. The web client puts it in the manage
                      link fragment, /manage/{id}#{manage_token}.
        '400':
          description: >-
            Validation error. `error` is one of `invalid content length`,
            `missing required headers` (absent, empty, or repeated X-Gone-*
            header), `invalid version`, `invalid nonce`, `invalid ttl`,
            `ttl invalid`, `short body` (the body ended before Content-Length
            bytes arrived), or `bad request`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '411':
          description: Content length required (missing Content-Length header)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large (size exceeds configured max)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Busy'
  /api/secret/{id}:
    get:
      summary: Claim a secret and retrieve its ciphertext
      operationId: claimSecret
      description: |
        Phase one of retrieval. Reserves the secret for the caller under a claim
        lease and streams the ciphertext with a claim token.
      tags: [secrets]
      parameters:
        - $ref: '#/components/parameters/SecretID'
        - in: header
          name: X-Gone-Claim
          required: false
          schema:
            type: string
          description: |
            Omit to make a fresh claim. Supply the token from a previous response to re-fetch
            the same ciphertext (e.g. after an interrupted download) before the lease lapses.
      responses:
        '200':
          description: Ciphertext payload. The secret is now claimed; acknowledge with DELETE once received.
          headers:
            X-Gone-Claim:
              $ref: '#/components/headers/ClaimToken'
            X-Gone-Claim-Expires:
              $ref: '#/components/headers/ClaimExpires'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Gone-Version:
              $ref: '#/components/headers/Version'
            X-Gone-Nonce:
              $ref: '#/components/headers/Nonce'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            `invalid id` for a malformed ID, or `invalid claim` for a malformed
            or repeated X-Gone-Claim header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found (missing, expired, consumed, or claimed by someone else / wrong claim token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Busy'
    delete:
      summary: Acknowledge receipt and delete a claimed secret
      operationId: ackSecret
      description: |
        Phase two of retrieval. Deletes the secret once the claim token holder
        confirms receipt.
      tags: [secrets]
      parameters:
        - $ref: '#/components/parameters/SecretID'
        - in: header
          name: X-Gone-Claim
          required: true
          schema:
            type: string
          description: Claim token returned by GET.
      responses:
        '204':
          description: Secret deleted.
        '400':
          description: >-
            `invalid id` for a malformed ID, or `invalid claim` for a missing,
            malformed or repeated X-Gone-Claim header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found (missing, expired, lease lapsed, or wrong claim token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Busy'
  /api/secret/{id}/status:
    get:
      summary: Check whether a secret is still waiting to be opened
      operationId: secretStatus
      tags: [manage]
      security:
        - manageToken: []
      description: |
        Sender-only. A claim with an active lease still reports pending. Read-only:
        checking status never claims, extends, or deletes the secret.
      parameters:
        - $ref: '#/components/parameters/SecretID'
      responses:
        '200':
          description: The secret is pending.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '400':
          $ref: '#/components/responses/ManageBadRequest'
        '404':
          $ref: '#/components/responses/ManageNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Busy'
  /api/secret/{id}/revoke:
    post:
      summary: Delete a secret before it is opened
      operationId: revokeSecret
      tags: [manage]
      security:
        - manageToken: []
      description: |
        Sender-only. Revoke always wins: it deletes the secret even during an active
        claim lease, and the recipient's re-fetch or acknowledgement then gets 404.
        A second revoke returns 404.
      parameters:
        - $ref: '#/components/parameters/SecretID'
      responses:
        '204':
          description: Secret deleted.
        '400':
          $ref: '#/components/responses/ManageBadRequest'
        '404':
          $ref: '#/components/responses/ManageNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Busy'
  /api/request:
    post:
      summary: Open a secret request
      operationId: createRequest
      tags: [requests]
      description: |
        Carries no body. The requester's browser keeps its key pair; the server
        learns only the TTL. Uses the create rate-limit budget.
      parameters:
        - in: header
          name: X-Gone-TTL
          required: true
          schema:
            type: string
          description: >-
            How long to wait for a reply (Go duration within [MinTTL, MaxTTL]).
            A reply is then kept for the same length of time.
      responses:
        '201':
          description: Request opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRequest'
        '400':
          description: >-
            `missing required headers`, `invalid ttl`, or `ttl invalid`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Busy'
  /api/request/{id}:
    get:
      summary: Check that a request can still be answered
      operationId: requestOpen
      tags: [requests]
      security:
        - fillToken: []
      description: Read-only. Used by the reply page before anyone types a secret.
      parameters:
        - $ref: '#/components/parameters/SecretID'
      responses:
        '200':
          description: The request is open.
          content:
            application/json:
              schema:
                type: object
                required: [state, expires_at]
                properties:
                  state:
                    type: string
                    enum: [open]
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/RequestBadRequest'
        '404':
          $ref: '#/components/responses/RequestNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
  /api/request/{id}/reply:
    put:
      summary: Send the reply
      operationId: fillRequest
      tags: [requests]
      security:
        - fillToken: []
      description: |
        The body is a protocol v3 ciphertext (pubE || ct || tag). Exactly one reply
        is accepted per request; a concurrent second reply gets 404. Uses the create
        rate-limit budget.
      parameters:
        - $ref: '#/components/parameters/SecretID'
        - in: header
          name: X-Gone-Version
          required: true
          schema:
            type: string
            enum: ['3']
        - in: header
          name: X-Gone-Nonce
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{16}$'
        - in: header
          name: Content-Length
          required: true
          schema:
            type: integer
            minimum: 1
          description: Exact ciphertext byte length; enforced against service MaxBytes.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Reply stored. It expires after the request's TTL, counted from now.
          content:
            application/json:
              schema:
                type: object
                required: [expires_at]
                properties:
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/RequestBadRequest'
        '404':
          $ref: '#/components/responses/RequestNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '411':
          description: Content length required (missing Content-Length header).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large (size exceeds configured max).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Busy'
    get:
      summary: Claim the reply
      operationId: claimReply
      tags: [requests]
      security:
        - manageToken: []
      description: |
        Requester-only. Behaves exactly like GET /api/secret/{id}: the response
        carries X-Gone-Version (3), X-Gone-Nonce, X-Gone-Claim and
        X-Gone-Claim-Expires, and a retry sends X-Gone-Claim.
      parameters:
        - $ref: '#/components/parameters/SecretID'
        - in: header
          name: X-Gone-Claim
          required: false
          schema:
            type: string
          description: |
            Omit to make a fresh claim. Supply the token from a previous response to re-fetch
            the same ciphertext before the lease lapses.
      responses:
        '200':
          description: The reply ciphertext. It is now claimed; acknowledge with DELETE once received.
          headers:
            X-Gone-Claim:
              $ref: '#/components/headers/ClaimToken'
            X-Gone-Claim-Expires:
              $ref: '#/components/headers/ClaimExpires'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Gone-Version:
              $ref: '#/components/headers/Version'
            X-Gone-Nonce:
              $ref: '#/components/headers/Nonce'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            `invalid id`, `invalid manage token` (X-Gone-Manage missing,
            repeated, or not 43 base64url characters), or `invalid claim` (a
            malformed or repeated X-Gone-Claim on a retry).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/RequestNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Busy'
    delete:
      summary: Acknowledge the reply
      operationId: ackReply
      tags: [requests]
      description: Sends X-Gone-Claim. Permanently deletes the reply.
      parameters:
        - $ref: '#/components/parameters/SecretID'
        - in: header
          name: X-Gone-Claim
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Reply deleted.
        '400':
          description: '`invalid id`, or `invalid claim` for a missing, malformed or repeated X-Gone-Claim.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/RequestNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Busy'
  /api/request/{id}/status:
    get:
      summary: Is the request waiting, or is its reply ready?
      operationId: requestStatus
      tags: [requests]
      security:
        - manageToken: []
      description: Requester-only and read-only, so polling costs no writes.
      parameters:
        - $ref: '#/components/parameters/SecretID'
      responses:
        '200':
          description: The request is waiting, or its reply is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
        '400':
          $ref: '#/components/responses/ManageBadRequest'
        '404':
          $ref: '#/components/responses/RequestNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
  /api/request/{id}/revoke:
    post:
      summary: Cancel a request, or delete an unopened reply
      operationId: cancelRequest
      tags: [requests]
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/SecretID'
      responses:
        '204':
          description: Cancelled.
        '400':
          $ref: '#/components/responses/ManageBadRequest'
        '404':
          $ref: '#/components/responses/RequestNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Busy'
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      description: >-
        Returns 200 while the process is running. Answers GET and HEAD only; any
        other method is 405 with `Allow: GET, HEAD`.
      tags: [health]
      responses:
        '200':
          description: Process is alive
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /readyz:
    get:
      summary: Readiness probe
      operationId: readyz
      description: >-
        Returns 200 when the readiness probe passes, 503 otherwise. The probe
        pings the database and opens the blob directory; its result is cached
        for 2 seconds, so a failure or recovery can take that long to show. The
        probe is not rate limited. Answers GET and HEAD only; any other method
        is 405 with `Allow: GET, HEAD`.
      tags: [health]
      responses:
        '200':
          description: Service ready
          content:
            text/plain:
              schema:
                type: string
                enum: [ready]
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          description: Not yet ready (the database ping or the blob directory check failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not ready
  /i18n/{tag}.json:
    get:
      summary: Message catalog for one language
      operationId: i18nCatalog
      description: |
        The web pages' messages for one locale, used to switch language in place
        without a reload. The pages request it with the catalog's content hash as
        `?v=`; with the current hash the response may be cached for a year,
        otherwise for five minutes. Only GET (and HEAD) is routed.
      tags: [i18n]
      parameters:
        - in: path
          name: tag
          required: true
          schema:
            type: string
            enum: [en, es, fr, de, pt-BR]
          description: >-
            BCP 47 language tag of a loaded catalog. Development builds also
            serve the pseudo-locale en-XA.
        - in: query
          name: v
          required: false
          schema:
            type: string
          description: The catalog's content hash, as the pages link it.
      responses:
        '200':
          description: The catalog, as a JSON object of message keys to message patterns.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=31536000, immutable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: No catalog for that tag (plain-text body).
          content:
            text/plain:
              schema:
                type: string
components:
  headers:
    ClaimToken:
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      description: Opaque claim token required to re-fetch or acknowledge.
    ClaimExpires:
      schema:
        type: string
        format: date-time
      description: When the claim lapses and the item is deleted if not acknowledged.
    NoStore:
      schema:
        type: string
        example: no-store
    Version:
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,2}$'
      description: Protocol version of the ciphertext.
    Nonce:
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{16}$'
      description: Unpadded base64url of the 12-byte nonce.
    ContentLength:
      schema:
        type: integer
  responses:
    MethodNotAllowed:
      description: Method not allowed. The Allow header lists the methods the path accepts.
      headers:
        Allow:
          schema:
            type: string
            example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: method not allowed
    Internal:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal
    ManageBadRequest:
      description: >-
        `invalid id` for a malformed ID, or `invalid manage token` when
        X-Gone-Manage is missing, repeated, or not 43 base64url characters.
        The token format check does not depend on the ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ManageNotFound:
      description: >-
        Not pending. The secret was opened, revoked, or expired, never existed,
        or the manage token is wrong. These cases are deliberately
        indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not found
    RequestBadRequest:
      description: >-
        `invalid id`, `invalid fill token`, `missing required headers`,
        `invalid version`, `invalid nonce`, `invalid content length`, or
        `short body` (the body ended before Content-Length bytes arrived).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequestNotFound:
      description: >-
        The request is not open (or, for the requester, not waiting or ready):
        it expired, was cancelled or answered, its reply was opened, it never
        existed, or the token is wrong. These cases are indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not found
    TooManyRequests:
      description: |
        Rate limited. The client exceeded its per-address budget. GONE_RATE_CREATE covers
        POST /api/secret, POST /api/request, and PUT /api/request/{id}/reply (the calls
        that upload or create). GONE_RATE_READ covers every /api/secret/{id} route,
        including status and revoke, and every other /api/request/{id} route. Retry after
        the indicated delay.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds until the next request will be accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate limited
    Busy:
      description: |
        Storage is overloaded: the write could not get SQLite's write lock within
        5 seconds. Nothing was changed, so the request can be retried as is.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: busy
  parameters:
    SecretID:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      description: Secret ID.
  schemas:
    Status:
      type: object
      required: [state, created_at, expires_at]
      properties:
        state:
          type: string
          enum: [pending]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CreatedRequest:
      type: object
      required: [id, expires_at, manage_token, fill_token]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{32}$'
        expires_at:
          type: string
          format: date-time
        manage_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        fill_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    RequestStatus:
      type: object
      required: [state, created_at, expires_at]
      properties:
        state:
          type: string
          enum: [waiting, ready]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  securitySchemes:
    manageToken:
      type: apiKey
      in: header
      name: X-Gone-Manage
      description: >-
        The manage_token returned at creation: 43 base64url characters
        (^[A-Za-z0-9_-]{43}$). Must appear exactly once. It is never logged.
        Because it is a custom header, cross-origin requests need a CORS
        preflight, which the server never grants.
    fillToken:
      type: apiKey
      in: header
      name: X-Gone-Fill
      description: >-
        The fill_token returned when a request is created, carried in the reply
        link's fragment: 43 base64url characters. Must appear exactly once. It
        authorizes one reply and is never logged.
# Secret creation, claim, and acknowledgement are anonymous by design; only the
# manage and request operations declare a security requirement.
security: []
