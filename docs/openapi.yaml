openapi: 3.0.3
info:
  title: Gone Secret Sharing API
  version: 0.2.0
  description: |
    Minimal API for one-time secret creation and consumption.
    Secrets are created with a TTL and may be stored inline or in external blob storage.
    Retrieval is two-phase: GET claims the secret and returns the ciphertext with a claim
    token; DELETE with that token acknowledges receipt and deletes it. A claimed secret is
    only re-served to the token holder and is deleted by the janitor if not acknowledged
    within the configured claim lease (GONE_CLAIM_LEASE).
    This spec enumerates all HTTP statuses the current implementation may emit.
servers:
  - url: http://localhost:8080
paths:
  /api/secret:
    post:
      summary: Create a new secret
      operationId: createSecret
      parameters:
        - in: header
          name: X-Gone-Version
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]{0,2}$'
            example: '1'
          description: >-
            Protocol version in canonical decimal (no sign, no leading zeros).
            Must be a supported version; currently only 1. Must appear exactly
            once. See docs/protocol.md §3 and §8.
        - in: header
          name: X-Gone-Nonce
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{16}$'
          description: >-
            Strict, canonical, unpadded base64url of the 12-byte AES-GCM nonce
            (protocol v1). Must appear exactly once. See docs/protocol.md §2.1
            and §4.
        - in: header
          name: X-Gone-TTL
          required: true
          schema:
            type: string
            pattern: '^[0-9]+(h|m|s)([0-9]+(h|m|s))*$'
          description: |
            Go duration string composed of hours, minutes, and seconds segments only (no days/weeks/months).
            Examples: 30s, 5m, 1h30m, 1h5m30s. Must fall within the configured inclusive min/max TTL bounds.
            The service also accepts any duration between the smallest and largest configured TTL options even if not explicitly listed.
        - in: header
          name: Content-Length
          required: true
          schema:
            type: integer
            minimum: 1
          description: Exact ciphertext byte length; enforced against service MaxBytes.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                type: object
                required: [id, expires_at]
                properties:
                  id:
                    type: string
                    description: 32-char lowercase hex secret ID
                    pattern: '^[0-9a-f]{32}$'
                  expires_at:
                    type: string
                    format: date-time
        '400':
          description: >-
            Validation error. `error` is one of `invalid content length`,
            `missing required headers` (absent, empty, or repeated X-Gone-*
            header), `invalid version`, `invalid nonce`, `invalid ttl`,
            `ttl invalid`, or `bad request`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Path not found (incorrect URL such as /api/secret/extra)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed (non-POST on /api/secret)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '411':
          description: Content length required (missing Content-Length header)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large (size exceeds configured max)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/secret/{id}:
    get:
      summary: Claim a secret and retrieve its ciphertext
      operationId: claimSecret
      parameters:
        - $ref: '#/components/parameters/SecretID'
        - in: header
          name: X-Gone-Claim
          required: false
          schema:
            type: string
          description: |
            Omit to make a fresh claim. Supply the token from a previous response to re-fetch
            the same ciphertext (e.g. after an interrupted download) before the lease lapses.
      responses:
        '200':
          description: Ciphertext payload. The secret is now claimed; acknowledge with DELETE once received.
          headers:
            X-Gone-Claim:
              schema:
                type: string
              description: Opaque claim token required to re-fetch or acknowledge.
            X-Gone-Claim-Expires:
              schema:
                type: string
                format: date-time
              description: When the claim lapses and the secret is deleted if not acknowledged.
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Gone-Version:
              schema:
                type: string
                pattern: '^[1-9][0-9]{0,2}$'
            X-Gone-Nonce:
              schema:
                type: string
                pattern: '^[A-Za-z0-9_-]{16}$'
            Content-Length:
              schema:
                type: integer
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid ID format or malformed claim token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found (missing, expired, consumed, or claimed by someone else / wrong claim token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed (not GET or DELETE on /api/secret/{id})
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Acknowledge receipt and delete a claimed secret
      operationId: ackSecret
      parameters:
        - $ref: '#/components/parameters/SecretID'
        - in: header
          name: X-Gone-Claim
          required: true
          schema:
            type: string
          description: Claim token returned by GET.
      responses:
        '204':
          description: Secret deleted.
        '400':
          description: Invalid ID format or missing/malformed claim token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found (missing, expired, lease lapsed, or wrong claim token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed (not GET or DELETE on /api/secret/{id})
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
  /readyz:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Service ready
        '503':
          description: Not yet ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  responses:
    TooManyRequests:
      description: |
        Rate limited. The client exceeded its per-address budget (GONE_RATE_CREATE for
        POST, GONE_RATE_READ for GET and DELETE). Retry after the indicated delay.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds until the next request will be accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate limited
  parameters:
    SecretID:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      description: Secret ID.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  securitySchemes: {}
security: []
