name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*', 'v*.*', 'v*']
    paths-ignore:
      - '.github/instructions/**'
      - 'scripts/**'
      - '.codacy.yml'
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - "Taskfile.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running the workflow'
        required: false

permissions:
  contents: read

env:
  GO_VERSION: '1.27'
  MINIFY_VERSION: v2.24.17
  TASK_VERSION: v3.54.0
  NODE_VERSION: '24'
  ESLINT_VERSION: '9.39.5'
  STYLELINT_VERSION: '17.15.0'

jobs:
  # Fast correctness check for PRs and branch pushes. No artifacts.
  verify:
    runs-on: ubuntu-latest
    # Skip when we're building tagged releases (handled by build_release)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Restore Go module cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Download dependencies
        run: go mod download

      - name: Install minify
        run: go install github.com/tdewolff/minify/v2/cmd/minify@${{ env.MINIFY_VERSION }}

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      # Ensure production pipeline compiles (minify + embed + -tags=prod)
      - name: Build (prod via Taskfile)
        run: $HOME/go/bin/task prod

      - name: Run tests
        run: go test -v -coverprofile=coverage.out ./...

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint JavaScript and CSS
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: |
          npx --yes eslint@${{ env.ESLINT_VERSION }} --max-warnings 0 web/js test/js
          npx --yes stylelint@${{ env.STYLELINT_VERSION }} 'web/css/*.css'

      - name: Run JavaScript tests
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='web/js/**'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          'test/js/*.test.js'

      - name: Save Go module cache
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Upload coverage to Codacy
        # Upload for main and same-repo PRs (fork PRs lack the secret).
        # On PRs the reporter attributes coverage to the PR head commit.
        if: >-
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.out
          language: 'go'
          force-coverage-parser: 'go'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Separate step because the Go report needs a forced parser; each
      # step runs report --partial + final, and a repeated final simply
      # recalculates the commit's aggregate coverage.
      - name: Upload JavaScript coverage to Codacy
        if: >-
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: lcov.info
          language: 'javascript'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and create release only on tags.
  build_release:
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Restore Go module cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install minify
        run: go install github.com/tdewolff/minify/v2/cmd/minify@${{ env.MINIFY_VERSION }}

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Build (prod via Taskfile)
        run: $HOME/go/bin/task prod

      # On tags, cut a GitHub Release with the built binary
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/gone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
