name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*', 'v*.*', 'v*']
    paths-ignore:
      - '.github/instructions/**'
      - 'scripts/**'
      - '.codacy.yml'
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - "Taskfile.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running the workflow'
        required: false

permissions:
  contents: read

env:
  GO_VERSION: '1.27'
  MINIFY_VERSION: v2.24.17
  TASK_VERSION: v3.54.0
  NODE_VERSION: '24'
  ESLINT_VERSION: '9.39.5'
  STYLELINT_VERSION: '17.15.0'
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...

      - name: Run golangci-lint (dev tags)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags dev ./...
  # Fast correctness check for PRs and branch pushes. No artifacts.
  verify:
    runs-on: ubuntu-latest
    # Skip when we're building tagged releases (handled by build_release)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Restore Go module cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Download dependencies
        run: go mod download

      - name: Install minify
        run: go install github.com/tdewolff/minify/v2/cmd/minify@${{ env.MINIFY_VERSION }}

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      # Ensure production pipeline compiles (minify + embed + -tags=prod)
      - name: Build (prod via Taskfile)
        run: $HOME/go/bin/task prod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Node is required: the CLI/browser interop tests run the real web
      # crypto through a Node bridge and must not silently skip in CI.
      - name: Run tests
        env:
          GONE_REQUIRE_NODE: '1'
        run: go test -race -v -coverprofile=coverage.out ./...

      - name: Lint JavaScript and CSS
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: |
          npx --yes eslint@${{ env.ESLINT_VERSION }} --max-warnings 0 web/js test/js test/interop
          npx --yes stylelint@${{ env.STYLELINT_VERSION }} 'web/css/*.css'

      - name: Run JavaScript tests
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='web/js/**'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          'test/js/*.test.js'

      - name: Save Go module cache
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Upload coverage to Codacy
        # Upload for main and same-repo PRs (fork PRs lack the secret).
        # On PRs the reporter attributes coverage to the PR head commit.
        if: >-
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.out
          language: 'go'
          force-coverage-parser: 'go'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Separate step because the Go report needs a forced parser; each
      # step runs report --partial + final, and a repeated final simply
      # recalculates the commit's aggregate coverage.
      - name: Upload JavaScript coverage to Codacy
        if: >-
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: lcov.info
          language: 'javascript'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tagged releases: test, cross-build the gone CLI and goned server,
  # attest build provenance, and publish archives with SHA256SUMS.
  # Runs its own tests because verify is skipped on tags.
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install minify
        run: go install github.com/tdewolff/minify/v2/cmd/minify@${{ env.MINIFY_VERSION }}

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      - name: Run tests
        env:
          GONE_REQUIRE_NODE: '1'
        run: go test -race ./...

      - name: Minify web assets
        run: $HOME/go/bin/task minify

      - name: Build release archives
        run: scripts/release.sh "$GITHUB_REF_NAME"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*.tar.gz, dist/*.zip'

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
