name: Build

on:
  push:
    branches: [main]
    # Release tags only; scripts/check-release-ref.sh enforces strict semver.
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
    # No paths-ignore: Codacy shows coverage for the newest commit on main,
    # so a docs-only push that skipped the tests would report 0%.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running the workflow'
        required: false

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'
  MINIFY_VERSION: v2.24.17
  TASK_VERSION: v3.54.0
  NODE_VERSION: '24'
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.9.0
  OSV_SCANNER_VERSION: v2.7.0

jobs:

  lint:
    runs-on: ubuntu-latest
    # Tags were linted on main; skipping them also keeps cached tooling out
    # of tag runs (see the release jobs).
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          go-version-file: go.mod
          check-latest: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...

      - name: Run golangci-lint (dev tags)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags dev ./...

      # install.sh and the package scripts run under any POSIX sh; the rest
      # are bash. shellcheck is pinned by digest (task shellcheck runs the
      # same image): the runner's own copy is older and reports differently.
      - name: Run shellcheck
        run: scripts/shellcheck.sh
  # Fast correctness check for PRs and branch pushes. No artifacts.
  verify:
    runs-on: ubuntu-latest
    # Skip when we're building tagged releases (handled by build_release)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    env:
      # Whether to upload coverage to Codacy: for main and same-repo PRs, which
      # have the CODACY_PROJECT_TOKEN secret. Dependabot's runs read it from
      # the Dependabot secrets, so it must be set there too: Codacy's required
      # checks wait for these uploads and never report without them. Fork PRs
      # can't have the secret.
      CODACY_UPLOAD: >-
        ${{ github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Download dependencies
        run: go mod download

      # Reports only vulnerabilities in code the module actually calls.
      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION"
          "$HOME/go/bin/govulncheck" ./...

      # Every manifest in the repo, tools and test packages included, so a new
      # vulnerable dependency, or a new ignore in an osv-scanner.toml, shows up
      # in its pull request rather than in the weekly Security Scan.
      - name: Check dependencies against OSV
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@"$OSV_SCANNER_VERSION"
          "$HOME/go/bin/osv-scanner" scan source --no-call-analysis=go -r .

      - name: Install minify
        run: go install github.com/tdewolff/minify/v2/cmd/minify@"$MINIFY_VERSION"

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@"$TASK_VERSION"

      # Ensure production pipeline compiles (minify + embed + -tags=prod)
      - name: Build (prod via Taskfile)
        run: $HOME/go/bin/task prod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          node-version: ${{ env.NODE_VERSION }}

      # Node is required: the CLI/browser interop tests run the real web
      # crypto through a Node bridge and must not silently skip in CI.
      - name: Run tests
        env:
          GONE_REQUIRE_NODE: '1'
        run: go test -race -v -coverprofile=coverage.out ./...

      # ESLint and stylelint are pinned, with their dependencies, in
      # tools/lint/package-lock.json.
      - name: Lint JavaScript and CSS
        run: |
          npm ci --prefix tools/lint --no-audit --no-fund --ignore-scripts
          tools/lint/node_modules/.bin/eslint --max-warnings 0 web/js web/dev site/assets/js test/js test/interop test/e2e
          tools/lint/node_modules/.bin/stylelint 'web/css/*.css'

      - name: Run JavaScript tests
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='web/js/**' --test-coverage-include='web/dev/**'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          'test/js/*.test.js'

      - name: Save Go module cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Upload coverage to Codacy
        # On PRs the reporter attributes coverage to the PR head commit.
        if: env.CODACY_UPLOAD == 'true'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.out
          language: 'go'
          force-coverage-parser: 'go'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Separate step because the Go report needs a forced parser; each
      # step runs report --partial + final, and a repeated final simply
      # recalculates the commit's aggregate coverage.
      - name: Upload JavaScript coverage to Codacy
        if: env.CODACY_UPLOAD == 'true'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: lcov.info
          language: 'javascript'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Browser end-to-end tests (test/e2e): the prod goned binary, the real
  # templates and the real CSP in Chromium, Firefox and WebKit. The JS unit
  # tests load scripts through a harness, so only this job catches a missing
  # or misordered <script> tag or a CSP violation.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install minify and Task
        run: |
          go install github.com/tdewolff/minify/v2/cmd/minify@"$MINIFY_VERSION"
          go install github.com/go-task/task/v3/cmd/task@"$TASK_VERSION"

      - name: Build (prod via Taskfile)
        run: $HOME/go/bin/task prod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        working-directory: test/e2e
        run: npm ci --no-audit --no-fund

      # Browser builds are linked against the OS release's libraries, so a cache
      # from another release (ubuntu-latest moving to 26.04) must not be reused.
      - name: Identify OS release
        id: os
        run: . /etc/os-release && echo "release=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.os.outputs.release }}-playwright-${{ hashFiles('test/e2e/package-lock.json') }}

      # Downloads only what the cache lacks; the system packages always install.
      - name: Install browsers
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        working-directory: test/e2e
        env:
          CI: 'true'
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test/e2e/playwright-report
          retention-days: 7

  # The website (site/): built with the pinned Hugo, which fails on a broken
  # link, anchor or unlisted doc, then tested in Chromium and Firefox as
  # GitHub Pages would serve it: no errors, nothing from another origin, axe
  # in both themes, and the install box, theme, search and menus working.
  site:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags, so the release marker names the newest release.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build the site
        env:
          CGO_ENABLED: '0'
        run: |
          HUGO_PARAMS_RELEASE="$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude '*-*')"
          export HUGO_PARAMS_RELEASE
          go tool -modfile=tools/hugo/go.mod hugo --source site --minify

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        working-directory: test/e2e
        run: npm ci --no-audit --no-fund

      # Browser builds are linked against the OS release's libraries, so a cache
      # from another release must not be reused.
      - name: Identify OS release
        id: os
        run: . /etc/os-release && echo "release=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.os.outputs.release }}-playwright-${{ hashFiles('test/e2e/package-lock.json') }}

      - name: Install browsers
        working-directory: test/e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run the site tests
        working-directory: test/e2e
        env:
          CI: 'true'
        run: npx playwright test -c site.config.js

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-report
          path: test/e2e/site-report
          retention-days: 7

  # A dry run of the release build (scripts/release.sh), then the .deb and
  # .rpm packages linted and installed on Debian, Ubuntu and Fedora
  # containers running systemd (test/packages/run.sh). The release goes on
  # to the install job.
  packages:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install minify and Task
        run: |
          go install github.com/tdewolff/minify/v2/cmd/minify@"$MINIFY_VERSION"
          go install github.com/go-task/task/v3/cmd/task@"$TASK_VERSION"

      - name: Build a release
        run: |
          $HOME/go/bin/task minify
          scripts/release.sh v0.0.0-ci

      - name: Check the packages
        run: test/packages/run.sh

      - name: Keep the release for the install job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          retention-days: 1

  # install.sh against that release, served the way GitHub serves releases,
  # on Linux and macOS (test/install/run.sh).
  install:
    needs: packages
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/

      - name: Check install.sh
        run: test/install/run.sh

  # The Helm chart without a cluster: helm lint, every scenario in
  # charts/gone/ci rendered and validated with kubeconform, and the
  # settings the chart must refuse (test/helm/lint.sh).
  helm:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install helm and kubeconform
        run: |
          test/helm/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check the chart
        run: test/helm/lint.sh

  # The Helm chart installed on kind, on the oldest and newest Kubernetes
  # it supports; the newest also routes through Envoy Gateway
  # (test/helm/run.sh). The node images are pinned by digest from the kind
  # release notes.
  helm-install:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: '1.34'
            node: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
            envoy: '0'
          - kubernetes: '1.37'
            node: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
            envoy: '1'
    name: helm-install (${{ matrix.kubernetes }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install minify and Task
        run: |
          go install github.com/tdewolff/minify/v2/cmd/minify@"$MINIFY_VERSION"
          go install github.com/go-task/task/v3/cmd/task@"$TASK_VERSION"

      - name: Build (prod via Taskfile)
        run: $HOME/go/bin/task build-prod

      - name: Install helm, kind and kubectl
        run: |
          test/helm/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install and test the chart
        env:
          NODE_IMAGE: ${{ matrix.node }}
          ENVOY: ${{ matrix.envoy }}
        run: test/helm/run.sh

  # Latency target (p95 under 50ms at 100 req/s) against the real stack.
  # The data directory is on RAM (/dev/shm): shared runner disks stall on
  # fsync for hundreds of milliseconds at random, which failed this job on
  # unchanged code. This job guards the code path; `task perf` with TMPDIR
  # on a real disk is the deployment benchmark (see test/perf_test.go).
  perf:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # zizmor: ignore[cache-poisoning] job never runs on tags; release jobs use no cache
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Run latency target test
        env:
          GONE_PERF: '1'
        # Compile first so only the test, not the build, uses the RAM disk.
        run: |
          findmnt -n -o FSTYPE /dev/shm | grep -qx tmpfs
          go test -c -o "$RUNNER_TEMP/perf.test" ./test
          TMPDIR=/dev/shm "$RUNNER_TEMP/perf.test" -test.run TestPerfLatencyTarget -test.count=1 -test.v

  # Tagged releases run their own tests, because verify is skipped on tags.
  # They run in a separate job with a read-only token, so test code and its
  # dependencies never hold the release job's write and signing permissions.
  release-test:
    name: Release tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # First: refuse anything but a semver tag on a commit already on main.
      - name: Check release tag
        run: scripts/check-release-ref.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          # A release must not restore a Go cache another ref wrote.
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Run tests
        env:
          GONE_REQUIRE_NODE: '1'
        run: go test -race ./...

  # Then cross-build the gone CLI and goned server, attest build
  # provenance, and publish archives with SHA256SUMS.
  release:
    name: Release binaries
    needs: release-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # create the GitHub release and upload its files
      id-token: write  # OIDC identity that signs the provenance (Sigstore)
      attestations: write  # store the attestation
      artifact-metadata: write  # record the attested artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Checked again here: this job holds the write and signing permissions.
      - name: Check release tag
        run: scripts/check-release-ref.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          # A release must not restore a Go cache another ref wrote.
          cache: false

      - name: Install minify
        run: go install github.com/tdewolff/minify/v2/cmd/minify@"$MINIFY_VERSION"

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@"$TASK_VERSION"

      - name: Minify web assets
        run: $HOME/go/bin/task minify

      - name: Build release archives
        run: scripts/release.sh "$GITHUB_REF_NAME"

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz, dist/*.zip, dist/*.deb, dist/*.rpm'

      # Attach the signed provenance to the release too, so it can be checked
      # offline (gh attestation verify --bundle) and is visible to Scorecard:
      # the full Sigstore bundle, plus its signed in-toto envelope (DSSE) as
      # .intoto.jsonl, the name Scorecard looks for.
      - name: Add provenance to release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/gone_${GITHUB_REF_NAME}.sigstore.json"
          jq -c '.dsseEnvelope' "$BUNDLE" > "dist/gone_${GITHUB_REF_NAME}.intoto.jsonl"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
            dist/*.sigstore.json
            dist/*.intoto.jsonl
