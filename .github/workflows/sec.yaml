name: Security Scan

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27'

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}

    # Built with the Go from setup-go: the gosec action's container ships its own
    # older Go with GOTOOLCHAIN=local and cannot load a module that needs a newer one.
    - name: Run Gosec Security Scanner
      run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...

  # Fuzz each target for a short time. Regular `go test` only replays the
  # seed corpus; this explores new inputs. A crash fails the job, and the
  # failing input is uploaded so it can be added to testdata/fuzz.
  fuzz:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Fuzz
      run: |
        set -euo pipefail
        grep -rlE '^func Fuzz' --include='*_test.go' internal | sort -u | while read -r file; do
          pkg="./$(dirname "$file")"
          for target in $(grep -oE '^func Fuzz[A-Za-z0-9_]+' "$file" | cut -d' ' -f2); do
            echo "::group::$pkg $target"
            go test "$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime 30s
            echo "::endgroup::"
          done
        done

    - name: Upload failing inputs
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-failures
        path: internal/**/testdata/fuzz/
