name: Security Scan

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27'

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    # Built with the Go from setup-go: the gosec action's container ships its own
    # older Go with GOTOOLCHAIN=local and cannot load a module that needs a newer one.
    - name: Run Gosec Security Scanner
      run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...