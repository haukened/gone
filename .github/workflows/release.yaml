name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/haukened/gone

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push the image (and its attestation) to GHCR.
      packages: write
      # Sign and store the image's build provenance attestation.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No QEMU needed: the builder cross-compiles (CGO off) and the runtime stage has no RUN steps.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      # Base images are Docker Hardened Images; pulling requires Docker Hub credentials.
      - name: Login to Docker Hardened Images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-release tags (e.g. v3.0.0-alpha.1) must not move :latest.
      - name: Compute image tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE_NAME}:${REF_NAME}"
            if [[ "$REF_NAME" != *-* ]]; then echo "${IMAGE_NAME}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push (multi-arch)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub-signed SLSA provenance for the pushed digest, so deployers can
      # check the image came from this workflow before running it:
      #   gh attestation verify oci://ghcr.io/haukened/gone:<tag> --repo haukened/gone
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          echo "## Image" >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
