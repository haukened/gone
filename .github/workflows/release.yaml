name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write
  contents: read

env:
  IMAGE_NAME: ghcr.io/haukened/gone

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No QEMU needed: the builder cross-compiles (CGO off) and the runtime stage has no RUN steps.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
          driver: docker-container

      # Base images are Docker Hardened Images; pulling requires Docker Hub credentials.
      - name: Login to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Image" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/haukened/gone:${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "Also tagged: latest" >> $GITHUB_STEP_SUMMARY
