name: Release

# The production auto-updater pulls :latest, so an image is published only
# for a strict semver tag (vMAJOR.MINOR.PATCH[-PRERELEASE]) on a commit that
# is already on main, and only after the tests pass. The tag filter below
# narrows the trigger; scripts/check-release-ref.sh is the actual check.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

# Never run two publishes of the same tag at once, and never cancel one halfway.
concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/haukened/gone
  CHART_REPO: ghcr.io/haukened/charts
  GO_VERSION: '1.27.3'
  NODE_VERSION: '24'

jobs:
  # Guard and tests, with a read-only token and no secrets.
  test:
    name: Check tag and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history, so the guard can check the tagged commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag
        run: scripts/check-release-ref.sh

      # No Go cache: a release must not restore a cache another ref wrote.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # Node is required: the CLI/browser interop tests run the real web
      # crypto through a Node bridge and must not silently skip.
      - name: Run tests
        env:
          GONE_REQUIRE_NODE: '1'
        run: go test -race ./...

  publish:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read  # check out the repository
      packages: write  # push the image and its attestation to GHCR
      id-token: write  # OIDC identity that signs the provenance (Sigstore)
      attestations: write  # store the attestation
      artifact-metadata: write  # record the attested image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Checked again here: this job holds the publishing permissions.
      - name: Check release tag
        run: scripts/check-release-ref.sh

      # No QEMU needed: the builder cross-compiles (CGO off) and the runtime stage has no RUN steps.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      # Base images are Docker Hardened Images; pulling requires Docker Hub credentials.
      - name: Login to Docker Hardened Images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-release tags (e.g. v3.0.0-alpha.1) must not move :latest.
      - name: Compute image tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE_NAME}:${REF_NAME}"
            if [[ "$REF_NAME" != *-* ]]; then echo "${IMAGE_NAME}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push (multi-arch)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.list }}
          # No GitHub Actions layer cache: a tag run can read main's cache
          # entries, which any job on main can write, so a release builds
          # every layer from the pinned base images.
          no-cache: true

      # GitHub-signed SLSA provenance for the pushed digest, so deployers can
      # check the image came from this workflow before running it:
      #   gh attestation verify oci://ghcr.io/haukened/gone:<tag> --repo haukened/gone
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The Helm chart, versioned with the release: chart 3.13.0 runs image
      # v3.13.0. It is pushed beside the image as an OCI artifact and
      # attested the same way:
      #   gh attestation verify oci://ghcr.io/haukened/charts/gone:<version> --repo haukened/gone
      - name: Install helm
        run: |
          test/helm/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Package and push the chart
        id: chart
        env:
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/gone --version "${REF_NAME#v}" --app-version "$REF_NAME" -d "$RUNNER_TEMP/chart"
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/gone-${REF_NAME#v}.tgz" "oci://$CHART_REPO" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest=$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' "$RUNNER_TEMP/push.log")
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest chart provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CHART_REPO }}/gone
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.list }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "## Image" >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo "## Chart" >> "$GITHUB_STEP_SUMMARY"
          echo "oci://$CHART_REPO/gone --version ${REF_NAME#v}" >> "$GITHUB_STEP_SUMMARY"
