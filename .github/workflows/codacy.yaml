name: Codacy Client-Side Analysis

# Codacy cannot run Go linters itself ("client-side tools"). This workflow runs
# them, converts their output to Codacy's format, and uploads the results.
# With "Run analysis on your build server" enabled in Codacy, every analyzed
# commit waits for resultsFinal, so this intentionally has no paths-ignore.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codacy-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.3'
  STATICCHECK_VERSION: '2026.2.1'
  GOLANGCI_LINT_VERSION: v2.14.0
  # Codacy's converters, pinned to a release and checked against a SHA-256.
  # Codacy publishes no checksum files; each digest is the one GitHub records
  # for the release asset (gh api repos/codacy/<name>/releases/tags/<version>
  # --jq '.assets[0].digest'), checked against a local download on
  # 2026-10-16. Update the version and digest together.
  CODACY_GOSEC_VERSION: '1.0.6'
  CODACY_GOSEC_SHA256: 7c32131774195d22e16c89f56ae560eca1880225d652621d564d0d55aee61ad5
  CODACY_STATICCHECK_VERSION: '3.0.22'
  CODACY_STATICCHECK_SHA256: 35c5733094da8931bf903dcf99b5980c646c3f8fddc4fba992cf06d51eb8f74e
  CODACY_GOLANGCI_LINT_VERSION: '0.0.9'
  CODACY_GOLANGCI_LINT_SHA256: 415081dfae5e8f7f6096f0e46a8ce87b2e45382d6eadba66fc774c7002366cb0
  CODACY_API: https://api.codacy.com/2.0

jobs:
  # Runs the linters and converters with no access to the Codacy token, and
  # hands the converted results to the upload job as an artifact.
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Repository secrets are unavailable to fork PRs, so neither job runs
    # for them. Dependabot's runs read CODACY_PROJECT_TOKEN from the
    # Dependabot secrets, so it must be set there too: Codacy waits for these
    # results before it reports its checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    env:
      # Codacy analyzes the PR head commit, not the synthetic merge commit.
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # gosec is pinned in tools/gosec/go.mod (see sec.yaml).
      - name: Install linters
        run: |
          go -C tools/gosec build -o "$(go env GOPATH)/bin/gosec" github.com/securego/gosec/v2/cmd/gosec
          go install honnef.co/go/tools/cmd/staticcheck@"$STATICCHECK_VERSION"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"

      - name: Download Codacy converters
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/codacy"
          mkdir -p "$dir"
          for entry in \
            "codacy-gosec:$CODACY_GOSEC_VERSION:$CODACY_GOSEC_SHA256" \
            "codacy-staticcheck:$CODACY_STATICCHECK_VERSION:$CODACY_STATICCHECK_SHA256" \
            "codacy-golangci-lint:$CODACY_GOLANGCI_LINT_VERSION:$CODACY_GOLANGCI_LINT_SHA256"; do
            IFS=: read -r name ver sum <<< "$entry"
            curl -fsSL -o "$dir/$name" \
              "https://github.com/codacy/$name/releases/download/$ver/$name-$ver"
            echo "$sum  $dir/$name" | sha256sum -c -
            chmod +x "$dir/$name"
          done

      # Linters exit non-zero when they find issues; that is expected here.
      - name: Run linters
        run: |
          gosec -fmt json -log "$RUNNER_TEMP/gosec.log" ./... > "$RUNNER_TEMP/gosec.json" || true
          staticcheck -f json ./... > "$RUNNER_TEMP/staticcheck.json" || true
          golangci-lint run --output.json.path stdout ./... > "$RUNNER_TEMP/golangci-lint.json" 2>/dev/null || true

      - name: Convert results for Codacy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          for tool in gosec staticcheck golangci-lint; do
            "$RUNNER_TEMP/codacy/codacy-$tool" < "$RUNNER_TEMP/$tool.json" > "$RUNNER_TEMP/results/$tool.json"
          done

      - name: Upload converted results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codacy-results
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 1

  # The only job that sees the token. It runs no repository code and no
  # downloaded tools: it posts the converted results and marks them final.
  upload:
    name: Upload to Codacy
    needs: analyze
    # Also after a failed analysis, so Codacy is told the results are final
    # instead of waiting for them.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions: {}
    env:
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Download converted results
        if: needs.analyze.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codacy-results
          path: ${{ runner.temp }}/results

      - name: Upload results to Codacy
        if: needs.analyze.result == 'success'
        env:
          PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          for tool in gosec staticcheck golangci-lint; do
            curl -fsS -XPOST -L \
              -H "project-token: $PROJECT_TOKEN" \
              -H "Content-type: application/json" \
              -d @"$RUNNER_TEMP/results/$tool.json" \
              "$CODACY_API/commit/$COMMIT/issuesRemoteResults"
            echo
          done

      - name: Signal Codacy results are final
        env:
          PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          curl -fsS -XPOST -L \
            -H "project-token: $PROJECT_TOKEN" \
            -H "Content-type: application/json" \
            "$CODACY_API/commit/$COMMIT/resultsFinal"
