# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

# dhi.io (Docker Hardened Images) needs a Docker Hub login. These are
# Dependabot secrets (Settings > Secrets > Dependabot), separate from the
# Actions secrets of the same name that release.yaml uses.
registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # The gosec scanner the weekly Security Scan builds (tools/gosec/go.mod).
  - package-ecosystem: "gomod"
    directory: "/tools/gosec"
    schedule:
      interval: "weekly"
    groups:
      gosec:
        patterns: ["*"]

  # Playwright for the browser end-to-end tests. Test-only: nothing in
  # test/e2e is built into Gone.
  - package-ecosystem: "npm"
    directory: "/test/e2e"
    schedule:
      interval: "weekly"
    groups:
      e2e:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Keeps the digest-pinned Docker Hardened Images in the Dockerfile current.
  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - dhi
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns: ["*"]

  # The Caddy and Gone images in the Compose example. Caddy is pinned by tag
  # and digest in deploy/compose.yaml.
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    groups:
      compose-images:
        patterns: ["*"]

  # The pinned lint tools (eslint, stylelint) used by CI and task lint-web.
  - package-ecosystem: "npm"
    directory: "/tools/lint"
    schedule:
      interval: "weekly"
    groups:
      lint-tools:
        patterns: ["*"]
