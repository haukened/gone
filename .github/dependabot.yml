# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # The gosec scanner the weekly Security Scan builds (tools/gosec/go.mod).
  - package-ecosystem: "gomod"
    directory: "/tools/gosec"
    schedule:
      interval: "weekly"
    groups:
      gosec:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Keeps the digest-pinned Docker Hardened Images in the Dockerfile current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns: ["*"]
