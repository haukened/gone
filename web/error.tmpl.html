<!DOCTYPE html>
<html lang="en">
<head>
	{{ template "assets" }}
	<title>Gone · {{ .Title }}</title>
</head>
<body>
	{{ template "header" "" }}
	<main id="main" tabindex="-1" class="main">
		<div class="view">
			<div class="pane">
				<p class="eyebrow"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-warn" /></svg>Error {{ .Status }}</p>
				<h1>{{ .Title }}</h1>
				<p class="lead">{{ .Message }}</p>
				<section class="next" aria-labelledby="error-next">
					<h2 id="error-next">What you can do</h2>
					<p class="note">Check the address, or start over from the home page.</p>
				</section>
				<a class="btn btn-primary" href="/"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-back" /></svg>Back to home</a>
			</div>
		</div>
	</main>
	{{ template "footer" . }}
</body>
</html>
