{{ define "assets" }}
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml" />
	<link rel="preload" href="/static/fonts/atkinson-next-latin.woff2" as="font" type="font/woff2" crossorigin />
	<link rel="stylesheet" href="/static/css/tokens.css" />
	<link rel="stylesheet" href="/static/css/base.css" />
	<link rel="stylesheet" href="/static/css/layout.css" />
	<link rel="stylesheet" href="/static/css/components.css" />
	<link rel="stylesheet" href="/static/css/pages.css" />
	<script src="/static/js/theme.js"></script>
{{ end }}

{{ define "sprite" }}
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
	<symbol id="i-mark" viewBox="0 0 24 24"><path d="M20.69 9.67A9 9 0 1 1 14.33 3.31" /></symbol>
	<symbol id="i-sealed" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="1.4" stroke-width="2.8" /></symbol>
	<symbol id="i-opened" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 7.79 13.5" /></symbol>
	<symbol id="i-gone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="1.6 3.1" /></symbol>
	<symbol id="i-lock" viewBox="0 0 24 24"><path d="M8 11V8a4 4 0 0 1 8 0v3" /><rect x="5" y="11" width="14" height="10" /></symbol>
	<symbol id="i-clip" viewBox="0 0 24 24"><path d="M16 7v9a4 4 0 0 1-8 0V6a2.5 2.5 0 0 1 5 0v9a1 1 0 0 1-2 0V8" /></symbol>
	<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 22 20H2z" /><path d="M12 9v5M12 16.5v1.5" /></symbol>
	<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" /><path d="M16 8V4H4v12h4" /></symbol>
	<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M4 20h16" /></symbol>
	<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12c3-5.5 6.5-7 10-7s7 1.5 10 7c-3 5.5-6.5 7-10 7s-7-1.5-10-7z" /><circle cx="12" cy="12" r="3" /></symbol>
	<symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" /></symbol>
	<symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6" /></symbol>
	<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" /></symbol>
</svg>
{{ end }}

{{ define "header" }}
{{ template "sprite" }}
<a class="skip" href="#main">Skip to content</a>
<header class="band">
	<div class="wrap">
		<a class="brand" href="/"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-mark" /></svg>Gone</a>
		<nav class="nav" aria-label="Site">
			<a href="/about">About</a>
			<button type="button" id="theme-toggle" aria-pressed="false" hidden>
				<svg class="ico" aria-hidden="true" focusable="false"><use href="#i-theme" /></svg>
				<span>Dark<span class="sr-only"> mode</span></span>
			</button>
		</nav>
	</div>
</header>
{{ end }}

{{ define "footer" }}
<footer class="foot">
	<div class="wrap">
		<p>Encrypted in your browser. This server only ever stores ciphertext.</p>
		<nav aria-label="Footer">
			<a href="/about">About</a>
			<a href="https://github.com/haukened/gone" rel="noopener noreferrer">Source</a>
			<a href="https://github.com/haukened/gone/graphs/contributors" rel="noopener noreferrer">&copy; 2026 Contributors</a>
		</nav>
	</div>
</footer>
{{ end }}
